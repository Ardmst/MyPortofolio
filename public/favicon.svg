<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Ardmst">
  <rect width="100" height="100" rx="22" fill="#3B82F6"/>
  <!--
    Shield redrawn narrow (w≈50, h=82, ratio 0.61) to match the original logo.
    Scaled to 0.80 inside the square for breathing room.
    stroke-width 7 × scale 0.80 = visual 5.6 px.
  -->
  <g transform="translate(50,50) scale(0.80) translate(-50,-50)"
     fill="none" stroke="#ffffff" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- shield frame -->
    <path d="M50 91 L25 68 L25 21 Q25 9 33 9 L67 9 Q75 9 75 21 L75 68 Z"/>
    <!-- solid diagonal -->
    <path d="M25 38 L75 65"/>
    <!-- wavy diagonal -->
    <path d="M23 54 L38 63 Q44 73 51 63 L75 80"/>
  </g>
</svg>
