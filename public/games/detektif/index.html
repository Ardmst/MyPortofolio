<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Detektif Ekosistem</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="audio-hint" style="display:none; position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(18,14,11,0.92); color:#f5efe6; padding:10px 22px; border-radius:24px; font-family:'Press Start 2P', monospace, sans-serif; font-size:11px; z-index:99; cursor:pointer; border:1px solid rgba(245,180,90,0.6); backdrop-filter:blur(6px); box-shadow:0 4px 16px rgba(0,0,0,0.6); letter-spacing:0.5px;">
			🔊 Klik di sini / layar game untuk mengaktifkan audio
		</div>

		<script>
		// --- WebAudio Autoplay, Mute Toggle & Resume Interceptor for Godot 4 HTML5 ---
		(function() {
			const allContexts = new Set();
			let userMuted = false;
			const OrigAudioContext = window.AudioContext || window.webkitAudioContext;
			if (OrigAudioContext) {
				const PatchedAudioContext = function(options) {
					const ctx = new OrigAudioContext(options);
					allContexts.add(ctx);
					ctx.addEventListener('statechange', function() {
						updateAudioHint();
						notifyParentAudioState();
					});
					return ctx;
				};
				PatchedAudioContext.prototype = OrigAudioContext.prototype;
				window.AudioContext = PatchedAudioContext;
				if (window.webkitAudioContext) {
					window.webkitAudioContext = PatchedAudioContext;
				}
			}

			function notifyParentAudioState() {
				let state = 'unknown';
				if (window.GodotAudioContext) {
					state = window.GodotAudioContext.state;
				}
				try {
					window.parent.postMessage({
						type: 'godot_audio_status',
						state: state,
						muted: userMuted || state !== 'running'
					}, '*');
				} catch(e) {}
			}

			function updateAudioHint() {
				const hint = document.getElementById('audio-hint');
				if (!hint) return;
				if (userMuted) {
					hint.style.display = 'none';
					return;
				}
				let hasSuspended = false;
				allContexts.forEach(ctx => {
					if (ctx && ctx.state === 'suspended') hasSuspended = true;
				});
				if (window.GodotAudioContext && window.GodotAudioContext.state === 'suspended') {
					hasSuspended = true;
				}
				const status = document.getElementById('status');
				const isEngineRunning = !status || status.style.visibility === 'hidden' || getComputedStyle(status).display === 'none';
				if (hasSuspended && isEngineRunning) {
					hint.style.display = 'block';
				} else {
					hint.style.display = 'none';
				}
			}

			function resumeAllAudio() {
				userMuted = false;
				allContexts.forEach(ctx => {
					if (ctx && ctx.state === 'suspended') {
						ctx.resume().catch(function() {});
					}
				});
				try {
					if (window.GodotAudioContext && window.GodotAudioContext.state === 'suspended') {
						window.GodotAudioContext.resume().catch(function() {});
					}
					if (typeof GodotAudio !== 'undefined' && GodotAudio.ctx && GodotAudio.ctx.state === 'suspended') {
						GodotAudio.ctx.resume().catch(function() {});
					}
				} catch (e) {}
				setTimeout(() => {
					updateAudioHint();
					notifyParentAudioState();
				}, 150);
			}

			function muteAllAudio() {
				userMuted = true;
				try {
					if (window.GodotAudioContext && window.GodotAudioContext.state === 'running') {
						window.GodotAudioContext.suspend().catch(function() {});
					}
				} catch (e) {}
				setTimeout(() => {
					updateAudioHint();
					notifyParentAudioState();
				}, 150);
			}

			function toggleAudio() {
				if (window.GodotAudioContext && window.GodotAudioContext.state === 'running' && !userMuted) {
					muteAllAudio();
				} else {
					resumeAllAudio();
				}
			}

			const hintEl = document.getElementById('audio-hint');
			if (hintEl) {
				hintEl.addEventListener('click', resumeAllAudio);
			}

			['click', 'pointerdown', 'mousedown', 'keydown', 'touchstart'].forEach(type => {
				window.addEventListener(type, function() {
					if (!userMuted) resumeAllAudio();
				}, { capture: true, passive: true });
				document.addEventListener(type, function() {
					if (!userMuted) resumeAllAudio();
				}, { capture: true, passive: true });
			});

			window.addEventListener('message', function(event) {
				if (event.data === 'resume_audio' || event.data === 'unmute_audio' || event.data === 'start_game') {
					resumeAllAudio();
				} else if (event.data === 'mute_audio') {
					muteAllAudio();
				} else if (event.data === 'toggle_audio') {
					toggleAudio();
				}
			});

			window.__resumeGodotAudio = resumeAllAudio;
			window.__muteGodotAudio = muteAllAudio;
			window.__toggleGodotAudio = toggleAudio;

			setInterval(updateAudioHint, 1000);
		})();
		</script>

			window.__resumeGodotAudio = resumeAllAudio;
			setInterval(updateAudioHint, 1000);
		})();
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":38838716,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			if (window.__resumeGodotAudio) {
				window.__resumeGodotAudio();
				setTimeout(window.__resumeGodotAudio, 400);
				setTimeout(window.__resumeGodotAudio, 1200);
			}
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
